<!DOCTYPE html>
<html lang="en">
<head> 
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | Online Event Registration System</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="site-header"></div>

    <main>
        <section class="container form-page">
            <h1>Create an Account</h1>
            <div id="formAlert"></div>

            <form id="registerForm" class="app-form" novalidate>
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" required>

                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" required>

                <label for="password">Password</label>
                <input type="password" id="password" name="password" minlength="6" required>

                <label for="confirm_password">Confirm Password</label>
                <input type="password" id="confirm_password" name="confirm_password" minlength="6" required>

                <span class="field-error" id="registerError"></span>

                <button type="submit" class="btn btn-primary">Sign Up</button>
            </form>

            <p>Already have an account? <a href="login.html">Login here</a>.</p>
        </section>
    </main>

    <div id="site-footer"></div>

    <script src="js/db.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/nav.js"></script>
    <script>
        if (isLoggedIn()) window.location.href = 'index.html';

        document.getElementById('registerForm').addEventListener('submit', function (e) {
            e.preventDefault();

            const name = document.getElementById('name').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const confirm = document.getElementById('confirm_password').value;
            const errorSpan = document.getElementById('registerError');

            // ---- Validation ----
            if (name === '') {
                errorSpan.textContent = 'Please enter your full name.';
                return;
            }
            if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                errorSpan.textContent = 'Please enter a valid email address.';
                return;
            }
            if (password.length < 6) {
                errorSpan.textContent = 'Password must be at least 6 characters.';
                return;
            }
            if (password !== confirm) {
                errorSpan.textContent = 'Passwords do not match.';
                return;
            }
            if (Users.findByEmail(email)) {
                errorSpan.textContent = 'An account with that email already exists.';
                return;
            }

            errorSpan.textContent = '';
            const user = Users.create({ name, email, password, role: 'user' });
            Session.set(user);
            window.location.href = 'events.html';
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head> 
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Registrations | Online Event Registration System</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="site-header"></div>

    <main>
        <section class="container">
            <h1>My Registrations</h1>
            <div id="formAlert"></div>
            <div id="registrationsContainer"></div>
        </section>
    </main>

    <div id="site-footer"></div>

    <script src="js/db.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/nav.js"></script>
    <script>
        requireLogin();
        const session = Session.get();

        function render() {
            const myRegs = Registrations.forUser(session.userId)
                .map(r => ({ ...r, event: Events.findById(r.eventId) }))
                .filter(r => r.event)
                .sort((a, b) => a.event.date.localeCompare(b.event.date));

            const container = document.getElementById('registrationsContainer');

            if (myRegs.length === 0) {
                container.innerHTML = `<p>You haven't registered for any events yet. <a href="events.html">Browse events</a>.</p>`;
                return;
            }

            container.innerHTML = `
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Event</th><th>Date</th><th>Location</th><th>Registered On</th><th>Action</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${myRegs.map(r => `
                            <tr>
                                <td>${escapeHtml(r.event.title)}</td>
                                <td>${new Date(r.event.date).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })}</td>
                                <td>${escapeHtml(r.event.location)}</td>
                                <td>${new Date(r.registeredAt).toLocaleString('en-US', { month: 'short', day: 'numeric', year: 'numeric', hour: 'numeric', minute: '2-digit' })}</td>
                                <td><button class="btn btn-danger btn-small" data-reg-id="${r.id}">Cancel</button></td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;

            container.querySelectorAll('button[data-reg-id]').forEach(btn => {
                btn.addEventListener('click', () => {
                    if (!confirm('Cancel this registration?')) return;
                    Registrations.cancel(Number(btn.dataset.regId), session.userId);
                    document.getElementById('formAlert').innerHTML =
                        `<div class="alert alert-success">Registration cancelled.</div>`;
                    render();
                });
            });
        }

        render();
    </script>
</body>
</html>
